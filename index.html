<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Scientific Calculator with Unit Converter, History, and Offline PWA support." />
    <meta name="theme-color" content="#0f172a" />
    <title>Scientific Calculator</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-theme="dark" data-mode="standard" data-history-open="false">
    <main class="calculator-shell">
      <aside id="history-panel" class="history-panel" aria-label="Calculation history">
        <div class="history-header">
          <h2>History</h2>
          <div class="history-header-actions">
            <button id="export-csv-btn" class="history-btn-small" type="button" title="Download history as CSV">CSV</button>
            <button id="export-txt-btn" class="history-btn-small" type="button" title="Download history as TXT">TXT</button>
            <button id="history-clear" class="history-clear" type="button" data-action="clear-history" title="Clear all calculations">Clear</button>
          </div>
        </div>
        <ul id="history-list" class="history-list"></ul>
      </aside>

      <section class="calculator" aria-label="Calculator">
        <div class="top-bar">
          <div class="top-bar-group">
            <button id="history-toggle" class="history-toggle" type="button" aria-label="Open history drawer" aria-expanded="false">
              History
            </button>
            <span class="brand">Calculator</span>
          </div>

          <div class="toolbar-actions">
            <div class="mode-switcher" role="tablist" aria-label="Calculator mode selector">
              <button type="button" class="mode-switch is-active" data-calculator-mode="standard" aria-pressed="true">Standard</button>
              <button type="button" class="mode-switch" data-calculator-mode="scientific" aria-pressed="false">Scientific</button>
              <button type="button" class="mode-switch" data-calculator-mode="converter" aria-pressed="false">Convert</button>
            </div>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme">☀️</button>
          </div>
        </div>

        <div class="memory-bar">
          <button class="memory-btn" type="button" data-action="memory-store" title="Store in memory">MS</button>
          <button class="memory-btn" type="button" data-action="memory-add" title="Add to memory">M+</button>
          <button class="memory-btn" type="button" data-action="memory-subtract" title="Subtract from memory">M-</button>
          <button class="memory-btn" type="button" data-action="memory-clear" title="Clear memory">MC</button>
          <span id="memory-indicator" class="memory-indicator" aria-live="polite">M: 0</span>
          <button class="memory-btn" type="button" data-action="memory-recall" title="Recall memory">MR</button>
        </div>

        <div class="display-wrapper">
          <div class="display-meta">
            <div class="display-meta-left">
              <span class="display-label">Expression</span>
              <span id="angle-status" class="angle-status">DEG</span>
            </div>
            <button id="copy-btn" class="copy-btn" type="button" title="Copy result to clipboard" aria-label="Copy result">
              <svg class="copy-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span id="copy-btn-text">Copy Result</span>
            </button>
          </div>
          <input id="display" class="display" type="text" readonly value="0" aria-label="Calculator display" />
        </div>

        <div class="scientific-grid" aria-label="Scientific functions">
          <button class="btn scientific" data-action="sin" title="Sine" aria-label="Sine">sin</button>
          <button class="btn scientific" data-action="cos" title="Cosine" aria-label="Cosine">cos</button>
          <button class="btn scientific" data-action="tan" title="Tangent" aria-label="Tangent">tan</button>
          <button class="btn scientific" data-action="pi" title="Pi (π)" aria-label="Pi">π</button>

          <button class="btn scientific" data-action="asin" title="Arcsine" aria-label="Arcsine">asin</button>
          <button class="btn scientific" data-action="acos" title="Arccosine" aria-label="Arccosine">acos</button>
          <button class="btn scientific" data-action="atan" title="Arctangent" aria-label="Arctangent">atan</button>
          <button class="btn scientific" data-action="e" title="Euler's Number (e)" aria-label="Euler's Number">e</button>

          <button class="btn scientific" data-action="square" title="Square (x²)" aria-label="Square">x²</button>
          <button class="btn scientific" data-action="power" title="Power (xʸ)" aria-label="Power">xʸ</button>
          <button class="btn scientific" data-action="sqrt" title="Square root (√)" aria-label="Square root">√</button>
          <button class="btn scientific" data-action="reciprocal" title="Reciprocal (1/x)" aria-label="Reciprocal">1/x</button>

          <button class="btn scientific" data-action="log" title="Logarithm (base 10)" aria-label="Logarithm">log</button>
          <button class="btn scientific" data-action="ln" title="Natural Logarithm (ln)" aria-label="Natural Logarithm">ln</button>
          <button class="btn scientific" data-action="factorial" title="Factorial (n!)" aria-label="Factorial">n!</button>
          <button class="btn secondary" data-action="toggle-sign" title="Toggle sign (±)" aria-label="Toggle sign">±</button>
        </div>

        <div class="angle-mode" aria-label="Angle mode selector">
          <button type="button" class="mode-btn is-active" data-angle-mode="deg" aria-pressed="true">DEG</button>
          <button type="button" class="mode-btn" data-angle-mode="rad" aria-pressed="false">RAD</button>
        </div>

        <div class="converter-panel" aria-label="Unit converter">
          <div class="converter-row">
            <label for="unit-type">Type</label>
            <select id="unit-type">
              <option value="temperature">Temperature</option>
              <option value="length">Length</option>
              <option value="weight">Weight</option>
              <option value="area">Area</option>
              <option value="volume">Volume</option>
              <option value="speed">Speed</option>
              <option value="time">Time</option>
              <option value="data">Data storage</option>
            </select>
          </div>

          <div class="converter-row">
            <label for="from-unit">From</label>
            <select id="from-unit">
              <option value="c">°C</option>
              <option value="f">°F</option>
              <option value="k">K</option>
              <option value="mm">mm</option>
              <option value="cm">cm</option>
              <option value="m">m</option>
              <option value="km">km</option>
              <option value="in">in</option>
              <option value="ft">ft</option>
              <option value="yd">yd</option>
            </select>
          </div>

          <div class="converter-row">
            <label for="to-unit">To</label>
            <select id="to-unit">
              <option value="c">°C</option>
              <option value="f" selected>°F</option>
              <option value="k">K</option>
              <option value="mm">mm</option>
              <option value="cm">cm</option>
              <option value="m">m</option>
              <option value="km">km</option>
              <option value="in">in</option>
              <option value="ft">ft</option>
              <option value="yd">yd</option>
            </select>
          </div>

          <button id="convert-btn" class="btn secondary convert-btn" type="button">Convert</button>
        </div>

        <div class="buttons" aria-label="Calculator keypad">
          <button class="btn secondary" data-action="clear">C</button>
          <button class="btn secondary" data-action="delete">DEL</button>
          <button class="btn secondary" data-action="percent">%</button>
          <button class="btn secondary" data-value="/">÷</button>

          <button class="btn" data-value="7">7</button>
          <button class="btn" data-value="8">8</button>
          <button class="btn" data-value="9">9</button>
          <button class="btn secondary" data-value="*">×</button>

          <button class="btn" data-value="4">4</button>
          <button class="btn" data-value="5">5</button>
          <button class="btn" data-value="6">6</button>
          <button class="btn secondary" data-value="-">−</button>

          <button class="btn" data-value="1">1</button>
          <button class="btn" data-value="2">2</button>
          <button class="btn" data-value="3">3</button>
          <button class="btn secondary" data-value="+">+</button>

          <button class="btn" data-value="0">0</button>
          <button class="btn" data-value=".">.</button>
          <button class="btn secondary" data-action="ans" title="Previous Answer">ANS</button>
          <button class="btn accent" data-action="equals">=</button>
        </div>
      </section>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
